<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Historique — Khaos</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root {
    --void: #0c0a10;
    --surface: #17131d;
    --surface-raised: #211a2c;
    --border: #2c2438;
    --crack: #ff5a36;
    --rift: #6e4bff;
    --text: #ece7f5;
    --text-dim: #8d84a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--void);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  body { padding: 48px 24px 80px; }
  .wrap { max-width: 640px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }
  h1 span { color: var(--crack); }

  #clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  #clear-btn:hover { border-color: var(--crack); color: var(--text); }

  #search {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    margin-bottom: 22px;
    transition: border-color 0.15s ease;
  }
  #search:focus { border-color: var(--rift); }
  #search::placeholder { color: var(--text-dim); }

  .day-label {
    color: var(--text-dim);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 22px 0 8px;
  }
  .day-label:first-of-type { margin-top: 0; }

  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .entry:hover { background: var(--surface-raised); }
  .entry-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rift);
    flex-shrink: 0;
  }
  .entry-title {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-url {
    color: var(--text-dim);
    font-size: 11.5px;
    max-width: 220px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .entry-time {
    color: var(--text-dim);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    flex-shrink: 0;
    width: 42px;
    text-align: right;
  }

  #empty {
    color: var(--text-dim);
    font-size: 13.5px;
    text-align: center;
    padding: 60px 0;
    display: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Histor<span>i</span>que</h1>
      <button id="clear-btn">Tout effacer</button>
    </header>
    <input id="search" type="text" placeholder="Rechercher dans l'historique…">
    <div id="list"></div>
    <div id="empty">Aucune page visitée pour l'instant.</div>
  </div>

  <script>
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const searchEl = document.getElementById('search');
    const clearBtn = document.getElementById('clear-btn');

    function dayLabel(ts) {
      const d = new Date(ts);
      const today = new Date();
      const yest = new Date(Date.now() - 86400000);
      const sameDay = (a, b) => a.toDateString() === b.toDateString();
      if (sameDay(d, today)) return "Aujourd'hui";
      if (sameDay(d, yest)) return 'Hier';
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function timeLabel(ts) {
      return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    async function render(query) {
      if (!window.khaosHistory) return;
      const entries = await window.khaosHistory.list(query || undefined);
      listEl.innerHTML = '';
      emptyEl.style.display = entries.length ? 'none' : 'block';

      let lastDay = null;
      for (const entry of entries) {
        const label = dayLabel(entry.visitedAt);
        if (label !== lastDay) {
          const dayEl = document.createElement('div');
          dayEl.className = 'day-label';
          dayEl.textContent = label;
          listEl.appendChild(dayEl);
          lastDay = label;
        }
        const row = document.createElement('div');
        row.className = 'entry';
        row.innerHTML = `
          <div class="entry-dot"></div>
          <div class="entry-title">${escapeHtml(entry.title)}</div>
          <div class="entry-url">${escapeHtml(entry.url)}</div>
          <div class="entry-time">${timeLabel(entry.visitedAt)}</div>
        `;
        row.addEventListener('click', () => { window.location.href = entry.url; });
        listEl.appendChild(row);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    let debounce;
    searchEl.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => render(searchEl.value.trim()), 150);
    });

    clearBtn.addEventListener('click', async () => {
      if (!window.khaosHistory) return;
      await window.khaosHistory.clear();
      render();
    });

    render();
  </script>
</body>
</html>
