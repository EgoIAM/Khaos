<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; font-src 'self'; style-src 'self' 'unsafe-inline';">
<title>Khaos</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="titlebar">
    <div id="incognito-badge" style="display:none;">
      <svg width="12" height="12" viewBox="0 0 16 16"><path d="M2 9c1-3 3-5 6-5s5 2 6 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="5.5" cy="10" r="1.6" fill="currentColor"/><circle cx="10.5" cy="10" r="1.6" fill="currentColor"/><path d="M7 10h2" stroke="currentColor" stroke-width="1.4"/></svg>
      Navigation privée
    </div>
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="new-tab-btn" title="Nouvel onglet">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="window-controls">
      <button id="min-btn" class="win-btn" title="Réduire">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="max-btn" class="win-btn" title="Agrandir">
        <svg viewBox="0 0 10 10" width="10" height="10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="close-btn" class="win-btn close" title="Fermer">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <div id="toolbar">
    <div id="nav-buttons">
      <button id="back-btn" class="nav-btn" title="Précédent" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="forward-btn" class="nav-btn" title="Suivant" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="reload-btn" class="nav-btn" title="Recharger">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V6h-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="home-btn" class="nav-btn" title="Accueil">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 7.5L8 2l6 5.5M4 6.5V14h8V6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="reader-btn" class="nav-btn" title="Mode lecture">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 3.5c1.8-.8 3.6-.8 5.5 0v9.5c-1.9-.8-3.7-.8-5.5 0z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M14 3.5c-1.8-.8-3.6-.8-5.5 0v9.5c1.9-.8 3.7-.8 5.5 0z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="address-bar">
      <span id="security-icon">◇</span>
      <input id="url-input" type="text" spellcheck="false" placeholder="Rechercher ou entrer une adresse…">
      <button id="palette-hint" title="Ouvrir la palette de commandes">
        <kbd>⌘K</kbd>
      </button>
      <button id="star-btn" title="Ajouter aux favoris">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.5l2 4.2 4.5.6-3.3 3.2.8 4.5L8 11.8l-4 2.2.8-4.5L1.5 6.3l4.5-.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="right-actions">
      <div id="downloads-wrap">
        <button id="downloads-btn" class="nav-btn" title="Téléchargements">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5v8.5M4.5 6.5L8 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12v1.5a1 1 0 001 1h9a1 1 0 001-1V12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="downloads-badge" style="display:none;">0</span>
        </button>
        <div id="downloads-dropdown">
          <div id="downloads-empty">Aucun téléchargement</div>
          <div id="downloads-list"></div>
        </div>
      </div>
      <div id="menu-wrap">
        <button id="menu-btn" class="nav-btn" title="Menu">
          <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="3" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/></svg>
        </button>
        <div id="menu-dropdown">
          <button id="menu-new-incognito">Nouvelle fenêtre privée</button>
          <button id="menu-history">Historique</button>
          <button id="menu-toggle-bookmarks-bar">Afficher la barre de favoris</button>
          <button id="menu-toggle-blocking">Bloqueur de traqueurs : activé</button>
          <div class="menu-divider"></div>
          <button id="menu-wallpaper-choose">Changer le fond d'écran…</button>
          <button id="menu-wallpaper-clear">Réinitialiser le fond d'écran</button>
        </div>
      </div>
    </div>
  </div>

  <div id="progress-bar"></div>

  <div id="bookmarks-bar"></div>

  <div id="zoom-indicator"></div>

  <div id="reader-overlay">
    <div id="reader-close-wrap">
      <button id="reader-close">
        <svg width="12" height="12" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>
        Fermer le mode lecture
      </button>
    </div>
    <article id="reader-content"></article>
  </div>

  <div id="webviews"></div>

  <div id="command-palette">
    <div id="command-palette-card">
      <div id="command-palette-input-wrap">
        <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="command-palette-input" type="text" placeholder="Onglets, historique, favoris, actions…" spellcheck="false" autocomplete="off">
        <kbd>Échap</kbd>
      </div>
      <div id="command-palette-results"></div>
    </div>
  </div>

  <template id="tab-template">
    <div class="tab">
      <span class="tab-favicon"></span>
      <span class="tab-title">Nouvel onglet</span>
      <button class="tab-close" title="Fermer l'onglet">
        <svg viewBox="0 0 10 10" width="9" height="9"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
